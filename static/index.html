<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <title>Pantrify</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header>
    <div class="brand"><span class="brand-mark">P</span><span>Pantrify</span></div>
    <div class="header-actions"><button class="new-list-button" data-new-list>New list</button><div class="shared"><i></i> Shared list</div></div>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow"><span>✦</span> Bree is 100% cute<span>✦</span></div>
      <div class="eyebrow"><span>✦</span> THIS WEEK'S SHOP <span>✦</span></div>
      <h1>What do we <em>need?</em></h1><form id="add-form">
        <div class="product-field">
          <label for="name">Add a product</label>
          <input id="name" name="name" placeholder="e.g. Sourdough bread" maxlength="120" required autocomplete="off">
        </div>
        <div class="form-row">
          <select id="category" name="category" aria-label="Category"></select>
          <input id="quantity" name="quantity" placeholder="Qty / note" maxlength="40" aria-label="Quantity or note">
          <button class="add-button" type="submit" aria-label="Add item"><span>＋</span></button>
        </div>
        <p id="error" role="alert"></p>
      </form>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="list">Shopping list <span id="count">0</span></button>
      <button class="tab" data-tab="history">Last time</button>
    </div>
    <section id="list-view"></section>
    <section id="history-view" hidden></section>
  </main>
  <div id="toast" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
