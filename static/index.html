<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Pantrify</title>
  <link rel="stylesheet" href="/static/styles.css?v=3">
  <link rel="stylesheet" href="/static/autocomplete.css?v=1">
  <link rel="stylesheet" href="/static/new-list-dialog.css?v=1">
  <link rel="stylesheet" href="/static/cute-toggle.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">Skip to shopping list</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Pantrify home">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V7M9.5 11.5c.5 1.2 1.3 1.8 2.5 1.8s2-.6 2.5-1.8"/></svg>
        <span>pantrify</span>
      </a>
      <div class="list-status">
        <div class="list-status-copy" aria-live="polite"><span id="cute-status">Bree is 100% cute</span><span> ·</span>
          <strong id="remaining-count">0</strong> remaining <span>·</span> <strong id="done-count">0</strong> done</div>
        <div class="cute-toggle-row">
          <span>100% cute:</span>
          <button id="cute-toggle" class="cute-toggle" type="button" role="switch" aria-checked="false" aria-label="Joe is 100% cute" aria-describedby="cute-status">
            <span aria-hidden="true">Bree</span><span aria-hidden="true">Joe</span>
          </button>
        </div>
      </div>
      <div class="header-actions">
        <button class="button button-secondary" data-new-list>New list</button>
        <button class="icon-button" type="button" data-open-settings aria-label="Open settings" title="Settings">&#9881;</button>
      </div>
    </div>
  </header>
  <main id="main">
    <form id="add-form" class="add-form">
      <div class="name-field"><label for="name">Add an item</label><input id="name" name="name" placeholder="Add an item..." maxlength="120" required autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="product-suggestions" aria-expanded="false"><div id="product-suggestions" class="product-suggestions" role="listbox" hidden></div></div>
      <div class="add-options">
        <label class="visually-hidden" for="category">Category</label><select id="category" name="category"></select>
        <label class="visually-hidden" for="quantity">Quantity or note</label><input id="quantity" name="quantity" placeholder="Qty / note" maxlength="40">
        <button class="button button-primary" type="submit"><span aria-hidden="true">＋</span> Add</button>
      </div>
      <p id="error" class="form-error" role="alert"></p>
    </form>
    <div class="tabs" role="tablist" aria-label="List views">
      <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="list-view" data-tab="list"><span class="tab-icon" aria-hidden="true">☷</span> Shopping list <span class="count-badge" id="count">0</span></button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="history-view" data-tab="history"><span class="tab-icon" aria-hidden="true">◷</span> Last time</button>
    <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="settings-view" data-tab="settings"><span class="tab-icon" aria-hidden="true">&#9881;</span> Settings</button>
    </div>
    <section id="list-view" role="tabpanel"></section>
    <section id="history-view" role="tabpanel" hidden></section>
    <section id="settings-view" role="tabpanel" hidden>
      <div class="settings-heading"><h1>Categories</h1><p>Add categories or change their name and colour.</p></div>
      <div id="category-settings"></div>
      <form id="category-form" class="category-form"><label for="new-category">New category</label><div class="category-form-row"><input id="new-category" name="name" maxlength="80" placeholder="e.g. Bakery" required><input class="color-input" type="color" name="color" value="#747B75" aria-label="Category colour"><button class="button button-primary" type="submit">Add category</button></div><p id="category-error" class="form-error" role="alert"></p></form>
    </section>
  </main>
  <dialog id="new-list-dialog" class="choice-dialog" aria-labelledby="new-list-title" aria-describedby="new-list-summary">
    <form method="dialog">
      <h2 id="new-list-title">Start a new list?</h2>
      <p id="new-list-summary"></p>
      <div class="choice-dialog-actions">
        <button class="button button-secondary" value="cancel">Cancel</button>
        <button class="button button-secondary" value="discard">Start without them</button>
        <button class="button button-primary" value="keep">Transfer items</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v=11"></script>
</body>
</html>
