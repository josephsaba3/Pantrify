<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Table Tennis World Tour — local reference</title>
    <link rel="stylesheet" href="game-modes.css" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #canvas-wrapper { position: absolute; inset: 0; overflow: hidden; }
      canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      #local-loading { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 16px Arial, sans-serif; pointer-events: none; }
      #local-loading[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="canvas-wrapper"><canvas id="canvas" aria-label="Table Tennis World Tour"></canvas></div>
    <div id="local-loading">Loading Table Tennis World Tour…</div>
    <main id="mode-flow" tabindex="-1" hidden aria-label="Game modes and competition progress"></main>
    <noscript>This game needs JavaScript enabled.</noscript>
    <script src="local-platform.js"></script>
    <script src="game.js"></script>
    <script src="difficulty.js"></script>
    <script src="finals-tournament.js"></script>
    <script src="handicap-challenge.js"></script>
    <script src="match-stats.js"></script>
    <script src="game-modes.js"></script>
    <script src="start.js"></script>
  </body>
</html>
